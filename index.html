<!DOCTYPE html>
<!--
  Javascript hook classes:
  
-->
<html>
  <head>
    <title>Your Giga Pet</title>
    <meta name="description" content="A cool thing made with Glitch">
    <link id="favicon" rel="icon" href="https://glitch.com/edit/favicon-app.ico" type="image/x-icon">
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="output.css">
    <link rel="stylesheet" href="style.css">
  </head>
  <body class="bg-slate-200">
    <header>
      <h1>
        
      </h1>
    </header>

    <!-- WRAPPER FOR SIDEBAR TO BE IN FLEXBOX WITH MAIN CONTENT -->
    <div class="flex gap-5">
      <!-- Each card's name and button id are filled in from pets[0], pets[1], pets[2] by script.js -->
      <aside class="flex w-48 shrink-0 flex-col gap-4 p-4 border-r border-gray-200">
        <div class="pet-card grid grid-rows-[3fr_1fr] aspect-[3/4] w-full overflow-hidden rounded-lg border-2 border-gray-700 shadow">
          <img class="h-full w-full object-cover" src="https://i.pinimg.com/736x/c6/57/31/c6573143af8fff3492dd9672a6de4e53.jpg" alt="Placeholder pet image">
          <button class="pet-name-button w-full rounded-none border-t-2 border-gray-700 bg-[#0A5AAB] px-4 py-2 font-semibold text-white hover:bg-sky-600">
            <span class="card-name">Biscuit</span>
          </button>
        </div>
        <div class="pet-card grid grid-rows-[3fr_1fr] aspect-[3/4] w-full overflow-hidden rounded-lg border-2 border-gray-700 shadow">
          <img class="h-full w-full object-cover" src="https://preview.redd.it/maomao-iis-mealtime-v0-lgmff6jkamve1.gif?format=png8&s=70b27ad25a27bbb4c6afd30241ed29bed9cd4707" alt="Placeholder pet image">
          <button class="pet-name-button w-full rounded-none border-t-2 border-gray-700 bg-[#0A5AAB] px-4 py-2 font-semibold text-white hover:bg-sky-600">
            <span class="card-name">Mittens</span>
          </button>
        </div>
        <div class="pet-card grid grid-rows-[3fr_1fr] aspect-[3/4] w-full overflow-hidden rounded-lg border-2 border-gray-700 shadow">
          <img class="h-full w-full object-cover" src="https://placehold.co/300x300?text=Pet" alt="Placeholder pet image">
          <button class="pet-name-button w-full rounded-none border-t-2 border-gray-700 bg-[#0A5AAB] px-4 py-2 font-semibold text-white hover:bg-sky-600">
            <span class="card-name">Whiskers</span>
          </button>
        </div>
      </aside>

      <main>
        <section class="pet-image-container">
          <!-- Replace pet image with your own pet image -->
          <img class="pet-image" src="">
        </section>
        <div class="flex gap-5">
          <section class="dashboard">
            <div>Name: <strong><span class="name"></span></strong></div>
            <div>Weight: <strong><span class="weight"></span> pounds</strong></div>
            <div>Happiness: <strong><span class="happiness"></span> tail wags (per min)</strong></div>
            <div class="button-container">
              <button class="treat-button p-1 rounded-md bg-sky-700! hover:shadow-lg">
                Treat
              </button>
              <button class="play-button p-1 rounded-md bg-sky-700! hover:shadow-lg">
                Play
              </button>
              <button class="exercise-button p-1 rounded-md bg-sky-700! hover:shadow-lg">
                Exercise
              </button>
            </div>
          </section>
          <section>
            <div>
              test
            </div>
          </section>
        </div>
      </main>
    </div>

    <!-- Your web-app is https, so your scripts need to be too -->
    <script src="https://code.jquery.com/jquery-2.2.1.min.js"
            integrity="sha256-gvQgAFzTH6trSrAWoH1iPo9Xc96QxSZ3feW6kem+O00="
            crossorigin="anonymous"></script>
  </body>
</html>
